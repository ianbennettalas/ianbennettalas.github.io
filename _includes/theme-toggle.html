<script>
  const toggle = document.querySelector('.theme-toggle');

  function createSunIcon() {
    const color = '#e8e4dc';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '20');
    svg.setAttribute('height', '20');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('style', `stroke: ${color} !important; color: ${color} !important;`);

    const elements = [
      {tag: 'circle', attrs: {cx: '12', cy: '12', r: '5'}},
      {tag: 'line', attrs: {x1: '12', y1: '1', x2: '12', y2: '3'}},
      {tag: 'line', attrs: {x1: '12', y1: '21', x2: '12', y2: '23'}},
      {tag: 'line', attrs: {x1: '4.22', y1: '4.22', x2: '5.64', y2: '5.64'}},
      {tag: 'line', attrs: {x1: '18.36', y1: '18.36', x2: '19.78', y2: '19.78'}},
      {tag: 'line', attrs: {x1: '1', y1: '12', x2: '3', y2: '12'}},
      {tag: 'line', attrs: {x1: '21', y1: '12', x2: '23', y2: '12'}},
      {tag: 'line', attrs: {x1: '4.22', y1: '19.78', x2: '5.64', y2: '18.36'}},
      {tag: 'line', attrs: {x1: '18.36', y1: '5.64', x2: '19.78', y2: '4.22'}}
    ];

    elements.forEach(({tag, attrs}) => {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
      el.setAttribute('stroke', color);
      el.setAttribute('stroke-width', '2');
      el.setAttribute('stroke-linecap', 'round');
      el.setAttribute('stroke-linejoin', 'round');
      el.setAttribute('style', `stroke: ${color} !important;`);
      svg.appendChild(el);
    });

    return svg;
  }

  function createMoonIcon() {
    const color = '#222';
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '20');
    svg.setAttribute('height', '20');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('style', `stroke: ${color} !important; color: ${color} !important;`);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z');
    path.setAttribute('stroke', color);
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    path.setAttribute('style', `stroke: ${color} !important;`);
    svg.appendChild(path);

    return svg;
  }

  function updateToggleIcon() {
    const theme = document.documentElement.getAttribute('data-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = theme === 'dark' || (theme !== 'light' && prefersDark);
    toggle.innerHTML = '';
    toggle.appendChild(isDark ? createSunIcon() : createMoonIcon());
  }

  updateToggleIcon();

  toggle.addEventListener('click', function() {
    const root = document.documentElement;
    const current = root.getAttribute('data-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = current === 'dark' || (current !== 'light' && prefersDark);
    const newTheme = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', newTheme);
    localStorage.setItem('theme', newTheme);
    updateToggleIcon();
  });
</script>
