---
layout: default
---
<main>
  <article>
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: "%B %-d, %Y" }}</p>

    {% if page.image %}
    <img src="{{ page.image }}" alt="{{ page.title }}" class="featured-image">
    {% endif %}

    {{ content }}

    <a href="/essays.html" class="back-link">&larr; Back to essays</a>
  </article>
</main>
